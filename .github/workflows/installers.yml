name: Installer CI

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/installers.yml'

jobs:
  generated-up-to-date:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Generate with PowerShell 7
        shell: pwsh
        run: ./scripts/build-installers.ps1
      - name: Verify generated files
        shell: pwsh
        run: git diff --exit-code -- scripts/dist
      - name: Compare PowerShell 5.1 and 7 generation
        shell: powershell
        run: |
          ./scripts/build-installers.ps1
          git diff --exit-code -- scripts/dist

  sh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Install ShellCheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -y && sudo apt-get install -y shellcheck; else brew install shellcheck; fi
      - name: Publish test binary
        run: dotnet publish src/Drawplate.Console -c Release -r ${{ matrix.rid }} -p:Version=1.2.3 -o out
      - name: Run installer tests
        shell: bash
        env:
          DRAWPLATE_TEST_BINARY: out/drawplate
          DRAWPLATE_TEST_RID: ${{ matrix.rid }}
        run: |
          shellcheck scripts/dist/install.sh
          sh scripts/tests/sh/run.sh
          sh scripts/tests/sh/progress.sh

  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Install analysis and test modules
        shell: ${{ matrix.shell }}
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Publish test binary
        shell: ${{ matrix.shell }}
        run: dotnet publish src/Drawplate.Console -c Release -r win-x64 -p:Version=1.2.3 -o out
      - name: Analyze installer
        shell: ${{ matrix.shell }}
        run: Invoke-ScriptAnalyzer -Path scripts/dist/install.ps1 -Settings scripts/PSScriptAnalyzerSettings.psd1 -EnableExit
      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        run: Invoke-Pester scripts/tests/ps1 -CI
