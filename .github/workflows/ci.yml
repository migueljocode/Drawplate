name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-publish:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # tag v4.2.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # tag v5.0.0
        with:
          global-json-file: global.json

      # dotnet restore --locked-mode is skipped until lock files exist (recorded in PROGRESS.md)

      - name: Build
        run: dotnet build src/Drawplate.slnx -c Release

      - name: Verify formatting
        run: dotnet format src/Drawplate.slnx --verify-no-changes

      # Linux + Windows: cached static binaries (avoids apt hang on ubuntu-latest).
      # macOS: setup-ffmpeg does NOT support Darwin ARM64 (macos-latest is arm64;
      # evermeet.cx has no arm64 builds — FedericoCarboni/setup-ffmpeg#21).
      # Use Homebrew on macOS instead (~20–30s, native arm64).
      - name: Setup FFmpeg (Linux/Windows)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Setup FFmpeg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install ffmpeg

      - name: Test
        run: dotnet test tests/Drawplate.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Report failing tests
        if: failure()
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Recurse -Filter *.trx -Path TestResults | ForEach-Object {
            [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
            foreach ($result in $report.TestRun.Results.UnitTestResult) {
              if ($result.outcome -eq 'Failed') {
                $message = ([string]$result.Output.ErrorInfo.Message -replace "\r?\n", ' ')
                if ($message.Length -gt 120) { $message = $message.Substring(0, 120) }
                $failed += "$($result.testName) :: $message"
              }
            }
          }
          Write-Output "::error title=Failing tests ($($failed.Count))::$($failed -join ' ;; ')"

      - name: Publish baseline (framework-dependent)
        run: dotnet publish src/Drawplate.Console -c Release -r ${{ matrix.rid }} -p:PublishAot=false --self-contained false -p:Version=0.0.0-ci -o out-baseline

      - name: Publish Native AOT
        run: dotnet publish src/Drawplate.Console -c Release -r ${{ matrix.rid }} -p:Version=0.0.0-ci -o out

      - name: Verify binary version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            actual="$(out/drawplate.exe --version)"
          else
            actual="$(out/drawplate --version)"
          fi
          test "$actual" = "drawplate 0.0.0-ci"

      - name: Native AOT conversion smoke
        shell: bash
        run: |
          mkdir -p smoke
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 -f lavfi -i sine=frequency=440:duration=1 -c:v libx264 -c:a aac -shortest smoke/input.mp4
          cd smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            ../out/drawplate.exe input.mp4
          else
            ../out/drawplate input.mp4
          fi
          test -s compressed/input.mp4

      - name: Native AOT SIGTERM smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p signal-smoke
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 -c:v libx264 signal-smoke/input.mp4
          cat > signal-smoke/slow-ffmpeg <<'EOF'
          #!/bin/sh
          sleep 30
          EOF
          chmod +x signal-smoke/slow-ffmpeg
          cd signal-smoke
          ../out/drawplate --ffmpeg-path "$PWD/slow-ffmpeg" input.mp4 >stdout.txt 2>stderr.txt &
          pid=$!
          sleep 1
          kill -TERM "$pid"
          set +e
          wait "$pid"
          status=$?
          set -e
          test "$status" -eq 130

      - name: Record binary sizes
        shell: bash
        run: |
          if [ -f "out/drawplate" ]; then
            AOT_SIZE=$(wc -c < out/drawplate)
            BASELINE_SIZE=$(wc -c < out-baseline/drawplate)
          else
            AOT_SIZE=$(wc -c < out/drawplate.exe)
            BASELINE_SIZE=$(wc -c < out-baseline/drawplate.exe)
          fi
          echo "## Binary size (${{ matrix.rid }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native AOT: $((AOT_SIZE / 1024)) KiB ($AOT_SIZE bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline: $((BASELINE_SIZE / 1024)) KiB ($BASELINE_SIZE bytes)" >> "$GITHUB_STEP_SUMMARY"
